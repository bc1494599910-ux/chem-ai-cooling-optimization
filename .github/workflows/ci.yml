name: Tests and saved evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.7
          uv sync --locked --extra dev
      - name: Numerical and experiment-contract tests
        run: uv run --locked --extra dev python -m pytest -q
      - name: Verify saved data, predictions, audits and source hashes
        run: uv run --locked --extra dev python scripts/verify_results.py results/baseline
      - name: Verify original report integrity
        run: sha256sum --check docs/references/SHA256SUMS
